services:
  mapine:
    build: .
    env_file: .env
    restart: always
    volumes:
      - ./volume:/app/volume
  mongo:
    image: mongo:7.0
    container_name: mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: mapine
      MONGO_INITDB_ROOT_PASSWORD: this1SPaSSWD4M0nG0
      MONGO_INITDB_DATABASE: mapine
    volumes:
      - mongo_data:/data/db
    networks:
      mapine:
        ipv4_address: 172.28.0.10

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: nominatim
      POSTGRES_PASSWORD: nominatim
      POSTGRES_DB: nominatim
    volumes:
      - nominatim-db-data:/var/lib/postgresql/data

  nominatim:
    image: mediagis/nominatim:5.1
    depends_on:
      - postgres
    environment:
      PBF_URL: https://download.geofabrik.de/asia/iran-latest.osm.pbf
      POSTGRES_HOST: postgres
      POSTGRES_USER: nominatim
      POSTGRES_PASSWORD: nominatim
      POSTGRES_DB: nominatim
    volumes:
      - nominatim-data:/var/lib/postgresql/data
    networks:
      mapine:
        ipv4_address: 172.28.0.20

volumes:
  mongo_data:
  nominatim-db-data:
  nominatim-data:

networks:
  mapine:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16