apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mapine-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mapine-config
data:
  HTTP_HOST: "0.0.0.0"
  HTTP_PORT: "3000"
  SQLITE_PATH: "/data/mapine.db"
  NOMINATIM_URL: ""
  NOMINATIM_MIN_INTERVAL: "1s"
  NOMINATIM_USER_AGENT: "OhMyAPI-Services/1.0.0"
  POI_PROVIDER: "raah"
  POI_SEARCH_URL: "https://search.raah.ir"
  POI_DETAILS_URL: "https://poi.raah.ir"
  POI_MIN_INTERVAL: "250ms"
  POI_CACHE_TTL: "24h"
  GEOCODE_CACHE_TTL: "168h"
  HTTP_REQUEST_TIMEOUT: "10s"
  PROVIDER_MAX_RETRIES: "2"
  LOG_LEVEL: "info"
  TELEGRAM_URL: "https://telebot.sayheymirza.workers.dev/api/v1/send-message"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mapine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mapine
  template:
    metadata:
      labels:
        app: mapine
    spec:
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mapine
          image: ghcr.io/mirzawho/mapine-services:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: mapine-config
          env:
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mapine-secret
                  key: TELEGRAM_BOT_TOKEN
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: mapine-secret
                  key: TELEGRAM_CHAT_ID
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: { path: /readyz, port: 3000 }
          startupProbe:
            httpGet: { path: /readyz, port: 3000 }
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: 3000 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mapine-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mapine
spec:
  type: LoadBalancer
  selector:
    app: mapine
  ports:
    - port: 3000
      targetPort: 3000
